name: Backend CI

on:
  push:
    branches: [main]
    paths: ['authcore-backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['authcore-backend/**', '.github/workflows/backend-ci.yml']

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: authcore-backend

    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: authcore-backend/.nvmrc
          cache: npm
          cache-dependency-path: authcore-backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint, format, types, circular imports, build
        run: npm run verify

      - name: Production dependency audit
        run: npm run audit:prod

      - name: End-to-end tests (all suites)
        env:
          E2E_PORT: '3999'
          E2E_MONGODB_URI: mongodb://localhost:27017/authcore_e2e
        run: npm run test:e2e
