<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">AuthCore</title>
  <desc id="d">AuthCore: reusable authentication and authorization backend plus a React starter kit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="18" fill="url(#grid)"/>
  <circle cx="230" cy="190" r="230" fill="url(#glow1)"/>
  <circle cx="1130" cy="360" r="260" fill="url(#glow2)"/>

  <!-- Shield with keyhole -->
  <g transform="translate(130 70)">
    <path d="M100 0 L190 34 V120 C190 190 150 236 100 262 C50 236 10 190 10 120 V34 Z" fill="url(#shield)"/>
    <path d="M100 18 L174 46 V120 C174 180 140 220 100 243 C60 220 26 180 26 120 V46 Z" fill="#1e1b4b" fill-opacity="0.35"/>
    <circle cx="100" cy="112" r="28" fill="#ffffff"/>
    <path d="M88 128 H112 L106 182 H94 Z" fill="#ffffff"/>
    <circle cx="100" cy="112" r="11" fill="#4338ca"/>
  </g>

  <!-- Orbit dots -->
  <g fill="#a5f3fc">
    <circle cx="96" cy="88" r="5"/>
    <circle cx="352" cy="120" r="4" fill="#c4b5fd"/>
    <circle cx="340" cy="320" r="6"/>
    <circle cx="108" cy="300" r="4" fill="#c4b5fd"/>
  </g>
  <path d="M70 200 A160 160 0 0 1 390 200" fill="none" stroke="#c4b5fd" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- Text -->
  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
    <text x="440" y="150" font-size="84" font-weight="800" fill="url(#title)" letter-spacing="-1">AuthCore</text>
    <text x="444" y="196" font-size="26" font-weight="600" fill="#e0e7ff">Authentication &amp; authorization you reuse,</text>
    <text x="444" y="230" font-size="26" font-weight="600" fill="#e0e7ff">not rebuild — API + React starter kit</text>

    <!-- Chips -->
    <g font-size="17" font-weight="600">
      <rect x="444" y="268" width="150" height="38" rx="8" fill="#4f46e5"/>
      <text x="519" y="293" text-anchor="middle" fill="#ffffff">JWT + Sessions</text>
      <rect x="606" y="268" width="128" height="38" rx="8" fill="#7c3aed"/>
      <text x="670" y="293" text-anchor="middle" fill="#ffffff">RBAC</text>
      <rect x="746" y="268" width="150" height="38" rx="8" fill="#db2777"/>
      <text x="821" y="293" text-anchor="middle" fill="#ffffff">Email flows</text>
      <rect x="908" y="268" width="150" height="38" rx="8" fill="#0891b2"/>
      <text x="983" y="293" text-anchor="middle" fill="#ffffff">Self-service</text>
      <rect x="1070" y="268" width="150" height="38" rx="8" fill="#059669"/>
      <text x="1145" y="293" text-anchor="middle" fill="#ffffff">Configurable</text>

      <rect x="444" y="318" width="188" height="38" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="538" y="343" text-anchor="middle" fill="#e0e7ff">NestJS · MongoDB</text>
      <rect x="644" y="318" width="250" height="38" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="769" y="343" text-anchor="middle" fill="#e0e7ff">React · Vite · Tailwind</text>
      <rect x="906" y="318" width="314" height="38" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="1063" y="343" text-anchor="middle" fill="#e0e7ff">Copy → rename → ship your product</text>
    </g>
  </g>
</svg>
